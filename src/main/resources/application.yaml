spring:
  application:
    name: "24002"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lab3_db}
    username: ${DB_USERNAME:lab_user}
    password: ${DB_PASSWORD:my_secret_password123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

jwt:
  secret: ${JWT_SECRET}
  access-ttl: 15m
  refresh-ttl: 7d
